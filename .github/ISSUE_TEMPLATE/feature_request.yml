name: Proposal
description: Propose a change that fits the documented Forge MVP.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete operator problem is currently unsolved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not an implementation preference.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: MVP fit
      description: Explain how this stays within the single-host Linux MVP and its non-goals.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing tools or simpler approaches.
    validations:
      required: true
